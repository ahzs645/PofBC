  <title>Expo 86 — Vittorio Fiorucci — reconstructed vector edition</title>
  <desc>Modern reconstruction from the user-supplied framed photograph. Four independently authored cubic Bezier silhouettes, 21 individual windows, and reused PofBC Expo logo and outlined bilingual footer. Signature is a removable approximate facsimile. Colours are estimated, not measured ink specifications. Catalogue page size 635 x 920 mm; image under frame may be cropped. No embedded raster images.</desc>
