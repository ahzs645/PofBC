<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1100 1600" width="1100" height="1600">
  <title>Vittorio signature, approximate drawn facsimile</title>
  <desc>Five editable hand-constructed cubic stroke paths based on the supplied poster photograph, cross-checked against the postcard reference. Visual approximation; no automatic tracing. Coordinates register to the 1100 by 1600 rectified reference. Keep as an optional separate group.</desc>
  <g id="signature-facsimile-approximate" aria-label="Approximate Vittorio signature" fill="none" stroke="#77756f" stroke-width="0.68" stroke-linecap="round" stroke-linejoin="round">
    <!-- Deliberate pen strokes, drawn in the enlarged crop's coordinate system. -->
    <g transform="translate(20 1230) scale(0.2)" stroke-width="3.4">
      <path id="signature-initial-downstroke" d="M 66,441 C 63,465 58,525 64,550 C 67,562 81,542 90,511 C 110,433 134,322 173,242 C 181,226 187,214 193,221"/>
      <path id="signature-long-swash" d="M 138,377 C 136,405 128,449 127,481 C 133,489 149,454 158,422 C 177,360 188,299 209,260 C 249,194 315,130 350,115 C 366,108 382,107 383,122 C 385,145 370,177 357,199 C 353,205 351,205 352,199"/>
      <path id="signature-tall-loop" d="M 205,272 C 198,319 189,368 181,407 C 176,429 181,436 190,415 C 215,369 247,285 260,227 C 259,260 246,319 236,358 C 231,376 236,376 244,365 C 255,350 267,330 276,323 C 290,312 302,335 315,332 C 331,329 339,299 335,272 C 332,247 317,246 308,260 C 296,278 298,284 305,289"/>
      <path id="signature-terminal-lettering" d="M 358,278 C 361,259 374,231 383,224 C 393,215 397,221 399,244 C 399,257 403,254 411,240 C 423,222 434,198 440,198 C 443,208 442,222 447,225 C 452,228 462,208 470,199 C 477,190 480,201 487,204 C 498,210 511,196 519,182 C 529,166 527,158 515,160 C 511,160 506,162 502,163"/>
      <path id="signature-pen-pressure-accent" stroke-width="1.7" d="M 197,296 C 200,286 203,278 205,273"/>
    </g>
  </g>
</svg>
