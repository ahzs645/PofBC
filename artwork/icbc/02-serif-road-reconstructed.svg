<title id="title">ICBC serif road badge — reconstruction</title><desc id="desc">Rebuilt from the researcher-supplied 1994-labelled raster crop. Letterform proportions and road curves are approximate; photographic perspective is regularized to a square. No automatic tracing, raster image or font dependency is used. Introduction and retirement dates remain unknown. Edition 02: The serif road-logo family is additionally documented on the 1992 annual report back cover, print code 2 93. Existing reconstructed paths are preserved; this source does not make them an exact official master.</desc>
