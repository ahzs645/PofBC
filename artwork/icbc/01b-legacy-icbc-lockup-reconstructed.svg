<title id="title">ICBC legacy abbreviated lockup — reconstruction</title><desc id="desc">Additional related lockup rebuilt after inspecting the CIPO image for mark 903609. A secondary owner index lists filing 12 January 1989. This is not a new era or a certified original master. Edition 02: Primary CIPO record 0903609 confirms filing 1989-01-12 and public notice 1989-05-17. Neither is asserted as the design launch.</desc>
