<svg xmlns="http://www.w3.org/2000/svg" width="164.207" height="41.984" viewBox="217.918 320.91 164.207 41.984"><title>BC Transit — red double arrow and blue wordmark, extracted from the paper bus</title><desc>The roof logo of the red-and-white Gallery In Transit paper bus (the model’s printable PDF, bc-transit-foldable.packcad.pdf): its three paths, the two arrow halves and the outlined lettering, kept as the PDF draws them, with nothing traced or redrawn. The design is the one on the roof of the June 1985 Vancouver poster bus; the model is a later drawing of it, so its letterforms, spacing and colours (#f31410, #172bb2, the model file’s values) are the model’s, not verified brand specifications.</desc>



































































































































































































































































































































































































































































































