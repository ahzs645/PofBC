<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Commercial Fisheries / Marine Resources Branch</title><desc id="desc">Three repeated fish crossed by two vertical and two horizontal grid lines in a rounded square. Same symbol carries two branch names. Historical reconstruction, November 2026; not an original vector master.</desc>
<defs><g id="fish-master"><path id="fish-outline" d="M 145 202 C 167 171 262 132 360 127 C 458 121 560 140 650 166 L 705 171 C 757 130 799 110 835 108 C 809 158 797 201 803 245 C 807 275 819 297 833 311 C 791 310 752 278 704 239 L 650 243 C 559 278 471 298 367 294 C 269 290 177 255 148 225 Q 137 214 145 202 Z" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
<path id="gill" d="M 263 178 C 291 202 289 239 251 263" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
<circle id="eye" cx="217" cy="190" r="10.5" fill="#FFFFFF"/></g></defs>
<g id="three-fish" fill="#FFFFFF"><use id="upper-fish" xlink:href="#fish-master"/><use id="middle-fish" xlink:href="#fish-master" transform="translate(0 287)"/><use id="lower-fish" xlink:href="#fish-master" transform="translate(0 574)"/></g>
<g id="grid" stroke="#FFFFFF" stroke-width="25"><path id="vertical-divisions" d="M 369 60 V 940 M 650 60 V 940"/><path id="horizontal-divisions" d="M 60 355 H 940 M 60 644 H 940"/></g>
<rect id="rounded-frame" x="37" y="37" width="926" height="926" rx="175" fill="none" stroke="#FFFFFF" stroke-width="74"/>
</svg>