<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Existing BC flag with geometric stripe extensions</title>
<desc id="desc">Reconstructed from reusable PofBC elements: twelve unaltered Spirit of BC flag paths, committed TeX Gyre Termes Regular glyph outlines with reversible weight and descender adjustments, three new geometric stripe extensions and a white panel. Layout estimated from Bennett-06(1).jpg. The original sign font and paint specification are unverified. No photographic tracing, raster image or font dependency in the master.</desc>
