  <title id="artwork-title">Main geometric lettering and border, no paper or oval</title>
  <desc id="artwork-description">Constructed vector recreation of BC Forest Service Protection Bulletin 1960 no. 3, page 4. Both status faces use one 1000 by 130 unit panel convention. Lettering uses reusable masters with independent width and height scaling; local shape variants improve photographic agreement but do not establish different historical fonts. Closed notice uses a modern League Spartan proxy with manually reconstructed variants. Exact historical typefaces, colours and physical dimensions are unverified. The small oval contains simplified interpretive detail. No raster images or autotraced contours are embedded.</desc>
