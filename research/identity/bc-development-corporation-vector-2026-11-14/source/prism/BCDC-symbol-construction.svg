<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="300" viewBox="0 0 280 300" role="img" aria-labelledby="artwork-title artwork-description">
<title id="artwork-title">BCDC editable geometric construction</title>
<desc id="artwork-description">Editable stroke-based master. One prism is repeated at quarter turns in the square base system, then the whole symbol is scaled vertically by 15/14. Use the expanded symbol for production.</desc>
<defs><g id="one-prism" transform="translate(5.75 5.75)"><path d="M0 0 H60 L117.5 57.5 V117.5 H57.5 L0 60 Z M0 60 H60 V0 M60 60 L117.5 117.5"/></g></defs><g fill="none" stroke="#000000" stroke-width="11.5" stroke-linecap="butt" stroke-linejoin="miter" transform="scale(1 1.07143)"><use href="#one-prism" transform="rotate(0 140 140)"/><use href="#one-prism" transform="rotate(90 140 140)"/><use href="#one-prism" transform="rotate(180 140 140)"/><use href="#one-prism" transform="rotate(270 140 140)"/></g>
</svg>
