  <title id="title">Don’t gamble with FIRE — B. C. Forest Service</title>
  <desc id="description">Clean two-colour vector reconstruction from the supplied historic badge image. Circular border, two dice with separate faces and elliptical pips, manually redrawn headline lettering, and individually outlined curved caption. No embedded bitmap, clipping mask, or autotraced contour. Recoloured for the PofBC poster collection from the reconstruction’s deep blue (#01375D) to the forest green of DON’T DROP IT! (#003E2D), so the two Forest Service badges share one green.</desc>
