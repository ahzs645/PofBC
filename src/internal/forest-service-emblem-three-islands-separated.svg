<title id="title">BC Forest Service: Three detached island shapes (colour-family study)</title>
<desc id="desc">Source-informed contemporary three-island version: preserves two black-and-white print islands and adds a third detached fragment in the style of the existing coloured PofBC master. That third island is not discernible in the black-and-white prints; none are joined.</desc>

