  <title id="logo-title">British Columbia Forest Service evergreen emblem with its name around it: vector reconstruction</title>
  <desc id="logo-description">The evergreen emblem reconstruction with “British Columbia Forest Service” set around it in outlined bold grotesque capitals, after a photograph of the emblem printed on a glass. The lettering is TeX Gyre Heros Bold standing in for an unidentified typeface; the ring is fitted to the photographed letter positions. Not an official master.</desc>
  
