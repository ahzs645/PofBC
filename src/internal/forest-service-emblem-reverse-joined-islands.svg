<title id="title">BC Forest Service: White on black · connected</title>
<desc id="desc">The outlined badge is a 4-quadrant mathematically symmetric superellipse (n=3.25), with constant 13.85-unit ink width. The BC profile, negative-space conifer and islands are manually authored Bezier shapes, not traced bitmaps. Connections between island marks are optional modern design studies.</desc>
