  <title id="logo-title">British Columbia evergreen emblem — vector reconstruction</title>
  <desc id="logo-description">Manually reconstructed editable vector artwork: a symmetrical curved green badge, white provincial silhouette and three separate islands, and a geometric dark-green evergreen. Flat colours; no raster images, tracing, fonts, filters or external dependencies. Colours are approximate matches to the supplied reference, not verified official specifications.</desc>
  
