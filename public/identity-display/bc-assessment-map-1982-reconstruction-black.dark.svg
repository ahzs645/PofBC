<title id="logo-title">British Columbia Assessment Authority - 1982 logo reconstruction</title>
<desc id="logo-description">Reconstruction from the supplied 1982 British Columbia Assessment Authority letterhead scan. Angular map geometry redrawn; lettering reconstructed from fitted, outlined Nimbus Sans Bold. The historical typeface and original gray ink value are not independently established. This artwork contains vector paths only; no embedded raster image or font dependency.</desc>
