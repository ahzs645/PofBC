<title id="title">Interior University Society - enamel pin artwork</title>
<desc id="desc">Reconstructed flat vector artwork: five-sided chamfered body, warm orange enamel, black lettering, burgundy bars, and pale metal surrounds on individual letters and bars. The outlined Nimbus Sans Bold black inlays receive a separate +0.020-cap-height optical edge expansion (4.32-unit black outline at a 108-unit base cap), while the metal backing contours remain unchanged. This is a reconstruction adjustment, not an identified historical font cut. Photographic colours, metal finish and dimensions are uncalibrated. Nominal viewBox only, not a production die or certified manufacturing drawing.</desc>
