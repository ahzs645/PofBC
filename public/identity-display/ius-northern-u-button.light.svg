<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="985.42" height="985.42" viewBox="7.292 7.292 985.417 985.417" role="img" aria-labelledby="title desc" fill="#000000"><title id="title">Northern U campaign button</title><desc id="desc">Flat vector reconstruction of the orange Northern U button shown in IMG_7955(1).jpeg. Northern combines a purpose-built capital N with fitted Bookman-derived lowercase outlines. The N has thinner tapered serifs, a lighter diagonal and a mainly leftward top-right cap; the large U is separately constructed from the observed serif, stem and bowl geometry. These are reconstruction choices, not an identified historical font. Photograph-derived colour is approximate. No physical glare or dome is included.</desc><path id="orange-button-face" fill="#DE8D3F" d="M10 500a490 490 0 1 0 980 0a490 490 0 1 0 -980 0Z"/><g id="northern-serif-word" aria-label="Northern" fill="#1D1D1B"><path id="northern-serif-word-1-N-custom" d="M96.3731 331.3278C106.6131 331.3278 114.2931 327.3179 127.0931 327.3179C132.2131 327.3179 136.0531 332.6644 141.1731 339.3476L205.1731 414.1991V348.704C205.1731 339.3476 198.7731 335.3377 183.4131 334.0011V328.6545H224.3731V458.308C224.3731 462.3179 220.5331 463.6545 216.6931 459.6446L132.2131 364.7436V436.9219C132.2131 448.9516 137.3331 454.2981 155.2531 456.9714V462.3179H98.9331V456.9714C109.1731 454.2981 111.7331 450.2882 111.7331 438.2585V350.0407C111.7331 340.6842 106.6131 336.6743 96.3731 335.3377V331.3278Z"/><path id="northern-serif-word-2-o" d="M278.9171 366.8104C251.2176 366.8104 232.4093 385.8745 232.4093 414.0969C232.4093 444.749 250.7047 464 279.772 464C308.4974 464 327.1347 445.1228 327.1347 415.9659C327.1347 385.8745 308.3264 366.8104 278.9171 366.8104ZM279.943 385.8745C290.715 385.8745 296.0155 395.9673 296.0155 416.7135C296.0155 435.7776 290.544 445.8704 279.943 445.8704C269 445.8704 263.5285 435.9645 263.5285 416.3397C263.5285 396.1542 269 385.8745 279.94