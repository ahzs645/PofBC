  <title id="title">Thompson Health Region symbol - reconstructed colour</title>
  <desc id="description">New vector reconstruction made 22 November 2026. Original production vector not recovered. Symbol geometry follows monochrome Thompson Health Region letterheads dated 9 September 1999, 9 June 2000 and 1 November 2001. Colour samples follow the historical raster on PDF page 71 (printed 63) of Environment Canada proceedings, catalogue En40-240-1/03-00E-PDF (2003): teal #00687A and ochre #C47900. These are sampled RGB values, not official colour specifications. All shapes are editable paths. Internal white areas are transparent knockouts.</desc>
