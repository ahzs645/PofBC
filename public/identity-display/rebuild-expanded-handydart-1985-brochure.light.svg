<title id="title">handyDART — historical 1985 brochure lockup, reconstruction</title>
<desc id="desc">Two original geometric BC Transit double-arrow paths reused from the PofBC paper-model SVG. Historical handyDART italic wordmark reconstructed with outlined type and top and bottom horizontal rules matched to the 1985 pamphlet scan. Not an official brand file.</desc>

