  <title id="title">BC TRADE — reconstructed vector artwork</title>
  <desc id="description">Manual reconstruction from the 1991 printed colour scan, checked against the 1989 newspaper example. Separate maple leaf, waving flag, five red flag bands, rising sun, and outlined lettering. Original scan controls geometry; colours are approximate. TRADE retains the open letter separations visible in both printed examples. No automatic tracing or embedded raster.</desc>
