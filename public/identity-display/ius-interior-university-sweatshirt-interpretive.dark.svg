  <title id="title">Interior University sweatshirt lettering - interpretive reconstruction</title>
  <desc id="desc">Interpretive reconstruction from the sweatshirt in the background photograph in IMG_7953(1).jpeg. The arched outlined word INTERIOR is visible; the lower UNIVERSITY line is partly concealed by folds and is completed by inference. Custom collegiate geometry and fitted serif outlines represent the visible style. The exact lower lettering, typeface, curve, proportions and print colour cannot be established from this small oblique source. This is a separate optional adaptation, not verified original artwork.</desc>
