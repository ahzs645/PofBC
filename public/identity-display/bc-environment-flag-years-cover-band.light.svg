<title id="title">BC Environment - diagonal cover banner with transparent knockout bands</title>
<desc id="description">Reconstruction of the uploaded BC Environment cover mark. Lettering is outlined from PofBC Helvetica Bold with individually adjusted placement and proportions. The twelve-path flag is reused from PofBC src/assets/flagMark.js at commit a8d35e4afcdf67447a6234ca0ace68689350ec82 and fitted to the reference with one affine transform. Colour values are sampled approximations. All visible logo elements are vector paths; no embedded image or font is required.</desc>
