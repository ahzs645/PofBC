  <title id="logo-title">British Columbia Place - reconstructed 1983 logo</title>
  <desc id="logo-description">Manually reconstructed from page 4 of the supplied 2023-F0003-24.pdf, a scan of the June 19, 1983 Grand Opening Gala programme. The symbol is rebuilt from equal circular bowls, straight stems and smooth cubic curves. All lettering is hand-built outline artwork; the shared h/l stem is preserved. No raster images, fonts or external resources. Blue #3093D2 is a scan-derived approximation. This is reconstructed artwork, not an official production master.</desc>
