<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 32 690 328" width="690" height="328" role="img" aria-labelledby="title desc">
<title id="title">British Columbia Place — early-1980s corporate signature — geometric reconstruction</title>
<desc id="desc">Modern researched reconstruction, made 2026-11-03. Documented historical uses: Gulf Islands Driftwood, 22 September 1982, p. 6; BC Place Grand Opening Gala programme, 19 June 1983, p. 4 (Canadian Museum of History). Hand-built circles, arcs and custom outlined lettering; no raster tracing, embedded image, live font or recovered original vector master. Designer, exact introduction date and production colour specification unknown. Blue is a representative colour-managed scan sample (#0096d6), not an authenticated brand colour.</desc>
