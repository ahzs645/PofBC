<title id="title">British Columbia Steamship Company (1975) Ltd. - reconstructed emblem</title>
<desc id="desc">Constructive monochrome vector reconstruction from the supplied token photograph. Shared circles, straight edges, mirrored facets and circular wave segments; eleven filled paths. No bitmap, automatic contour trace or font dependency. Geometric regularization, not an original master.</desc>
