<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" width="1437.49" height="380" viewBox="0 0 1437.49 380" role="img" aria-labelledby="title description">
  <title id="title">British Columbia Railway - reconstructed five-petal logo</title>
  <desc id="description">Independent vector reconstruction of the five-petal British Columbia Railway dogwood herald. Manual cubic Bezier contours, true circles and custom wordmark glyph outlines. Main geometry reference: supplied railcar photograph IMG_7919.jpeg; secondary: IMG_7923.png. Microgramma Bold Extended family documented in The Cariboo issue 31, January 1998. Colours and precise curves are interpretive reconstruction choices, not authenticated corporate specifications. No embedded raster images, live fonts or external dependencies.</desc>
