<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Foundation colour proportions</title>
  <desc id="desc">PofBC diagram of the six press-kit colours paired in the proportions shown in the 2025 playbook.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="19" fill="#2a2828">
  <text x="160" y="31" text-anchor="middle">≈ 50%</text>
  <rect x="0" y="48" width="320" height="106" fill="#2a2828"/>
  <text x="12" y="116" fill="#ffffff">Charcoal</text>
  <text x="12" y="139" fill="#ffffff" font-size="15">#2A2828</text>
  <rect x="0" y="154" width="320" height="106" fill="#e6ffa7"/>
  <text x="12" y="222" fill="#2a2828">Moss</text>
  <text x="12" y="245" fill="#2a2828" font-size="15">#E6FFA7</text>
  <text x="400" y="31" text-anchor="middle">≈ 25%</text>
  <rect x="320" y="48" width="160" height="106" fill="#422628"/>
  <text x="332" y="116" fill="#ffffff">Umber</text>
  <text x="332" y="139" fill="#ffffff" font-size="15">#422628</text>
  <rect x="320" y="154" width="160" height="106" fill="#ff7a65"/>
  <text x="332" y="222" fill="#2a2828">Sunset</text>
  <text x="332" y="245" fill="#2a2828" font-size="15">#FF7A65</text>
  <text x="560" y="31" text-anchor="middle">≈ 25%</text>
  <rect x="480" y="48" width="160" height="106" fill="#08314c"/>
  <text x="492" y="116" fill="#ffffff">Midnight</text>
  <text x="492" y="139" fill="#ffffff" font-size="15">#08314C</text>
  <rect x="480" y="154" width="160" height="106" fill="#aae0e7"/>
  <text x="492" y="222" fill="#2a2828">Mist</text>
  <text x="492" y="245" fill="#2a2828" font-size="15">#AAE0E7</text>
  </g>
</svg>
