<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="330" height="290" viewBox="510 72 330 290" role="img" aria-labelledby="logo-title logo-description">
<title id="logo-title">British Columbia Assessment Authority - 1982 logo reconstruction</title>
<desc id="logo-description">Reconstruction from the supplied 1982 British Columbia Assessment Authority letterhead scan. Angular map geometry redrawn; lettering reconstructed from fitted, outlined Nimbus Sans Bold. The historical typeface and original gray ink value are not independently established. This artwork contains vector paths only; no embedded raster image or font dependency.</desc>
<g transform="rotate(0.24 724 180)"><g id="bc-map" aria-label="Stylized British Columbia map with three islands">
<g id="mainland">
<path fill="#000000" fill-rule="evenodd" d="M 525.800,87.700 L 735.600,87.200 L 735.600,213.400 L 728.800,231.700 L 822.000,332.900 L 674.500,334.100 L 614.600,285.800 L 592.000,226.900 L 613.600,195.800 L 566.500,124.700 L 531.600,133.100 Z M 540.400,104.600 L 721.200,104.000 L 721.800,210.500 L 714.400,233.700 L 793.900,320.800 L 678.100,322.000 L 624.700,277.100 L 606.100,228.000 L 629.200,196.000 L 571.000,110.600 L 542.000,117.500 Z"/>
</g>
