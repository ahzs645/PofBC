name: Deploy generator site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Repeat the full test suite before deployment'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS, not Ubuntu. The build subsets the real Helvetica the source artwork is set in, and the
    # only copy it can legally reach is the one macOS itself ships — the font is not committed to
    # this repository. On a Linux runner there is nothing to subset and the build stops.
    runs-on: macos-latest

    steps:
      # Submodules are fetched below, one at a time and only as much as the build reads, rather
      # than all of them in full here: that was about 2 GB, and one timeout failed the deploy.
      - uses: actions/checkout@v7

      # The tools that are built rather than imported (geo-toolkit's dist/, PackCAD's viewer) are
      # cached by the commits this repository pins and by the scripts that build them. While the
      # pins are unchanged the deploy restores them and never fetches those three repositories.
      - name: Key the tool builds by their pinned commits
        id: tools
        run: |
          pins="$(git ls-tree HEAD vendor/geo-toolkit vendor/atelier vendor/packcad | awk '{print substr($3, 1, 12)}' | paste -sd- -)"
          echo "key=tools-${{ runner.os }}-${pins}-${{ hashFiles('scripts/build-geo-toolkit.mjs', 'scripts/build-packcad.mjs') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: tools-cache
        with:
          # geo-toolkit's dist/ imports its own dependencies (lucide-react, d3, deck.gl…) from its
          # node_modules, so they are kept with it.
          path: |
            vendor/geo-toolkit/dist
            vendor/geo-toolkit/node_modules
            public/packcad
          key: ${{ steps.tools.outputs.key }}

      # Shallow, at the pinned commit, retried on failure (.github/scripts/fetch-submodule.sh).
      # vendor/json-url compresses a lockup into a share link, and its dist/ is built rather than
      # committed, so it has to be here before npm can resolve the dependency. PlateForge is read
      # from src/ alone.
      - name: Fetch submodules
        run: |
          .github/scripts/fetch-submodule.sh vendor/json-url
          .github/scripts/fetch-submodule.sh vendor/patcher
          .github/scripts/fetch-submodule.sh vendor/brandkit
          .github/scripts/fetch-submodule.sh vendor/plateforge src

      - name: Fetch the tools to build
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          .github/scripts/fetch-submodule.sh vendor/geo-toolkit
          .github/scripts/fetch-submodule.sh vendor/atelier
          .github/scripts/fetch-submodule.sh vendor/packcad

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Check Helvetica is present
        run: |
          if [ ! -f /System/Library/Fonts/Helvetica.ttc ]; then
            echo "::error::Helvetica.ttc is missing from this runner."
            echo "The lockups are set in Helvetica and the font is not committed."
            echo "Either restore a macOS runner, or point FONT_SOURCE at a licensed copy."
            exit 1
          fi

      - run: npm ci

      # Explicit rather than relying on the `prepare` lifecycle: builds the json-url submodule,
      # consolidates the mark, and subsets the fonts. Everything below needs the output.
      - run: npm run build:assets

      # Guards the reconstruction against the source artwork, the share-link validation, and the
      # outline geometry. Run after the assets exist so nothing is skipped for want of them.
      # Push deployments retain the full suite. A reviewed manual release can
      # use its recorded local validation without repeating the tests.
      - name: Run the full test suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: npm test

      # `npm run build` would run build:assets a second time (the salary search alone is ~25 s);
      # the assets were built above, so only Vite is left.
      - name: Build the site
        run: npx vite build
        env:
          # The repository's own name, so renaming it cannot leave the asset URLs pointing at a
          # path that no longer exists.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
