name: Prepare Sunshine review exports

on:
  push:
    branches: [codex/sunshine-coverage-audit-20261031]
    paths:
      - '.github/workflows/prepare-sunshine-exports.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'ahzs645/PofBC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and verify the accepted source exports
        run: |
          npm run build:salaries
          npm run check:salaries
          npm run audit:municipal-salaries
          npm run follow-up:municipal-salaries
          npm run audit:sunshine
          npm run test:sunshine
          npm run review:sector-salaries
          npm run review:municipal-wave
          npm run review:municipal-history
      - name: Commit only generated salary outputs to this review branch
        run: |
          git add public/salaries src/government/salaryIndex.js research/salaries/coverage-inventory.md research/salaries/source-inventory.md research/salaries/municipal-audit research/salaries/sunshine-lists
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate verified salary exports for the coverage comparison'
          git push origin HEAD:refs/heads/codex/sunshine-coverage-audit-20261031
