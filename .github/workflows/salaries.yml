name: Verify salary sources and exports

on:
  pull_request:
    paths:
      - 'research/salaries/**'
      - 'public/salaries/**'
      - 'scripts/**'
      - 'src/salaries/**'
      - 'src/government/Salaries.jsx'
      - 'src/government/salaries.test.js'
      - 'src/government/salaryIndex.js'
      - 'src/site/site.css'
      - 'package*.json'
      - '.github/workflows/salaries.yml'
      - '.github/workflows/salary-search.yml'
      - '.github/ci/**'
  push:
    branches: [main]
    paths:
      - 'research/salaries/**'
      - 'public/salaries/**'
      - 'scripts/**'
      - 'src/salaries/**'
      - 'src/government/Salaries.jsx'
      - 'src/government/salaries.test.js'
      - 'src/government/salaryIndex.js'
      - 'src/site/site.css'
      - 'package*.json'
      - '.github/workflows/salaries.yml'
      - '.github/workflows/salary-search.yml'
      - '.github/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  salaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select salary validation
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s .github/ci -p 'test_*.py'
          python3 .github/ci/select-checks.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.data == 'true'
        with:
          python-version: '3.12'
      # Match the reviewed PDF parser environment documented for salary extraction.
      - name: Install PDF parser test dependency
        if: steps.scope.outputs.data == 'true'
        run: |
          python -m pip install PyMuPDF==1.26.6 pdfplumber==0.11.9
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      # This salary-only check needs neither the licensed artwork fonts nor live report downloads.
      - run: npm ci --ignore-scripts
      - name: Test salary data and interface behavior
        run: node --test --test-concurrency=1 scripts/salary-data.test.mjs scripts/reviewed-name-connections.test.mjs scripts/held-name-connections.test.mjs scripts/lib/repeat-name-connections.test.mjs scripts/salary-baseline-context.test.mjs scripts/follow-through-source-qualifications.test.mjs scripts/follow-through-name-connections.test.mjs scripts/baseline-likely-connections.test.mjs src/salaries/*.test.js src/government/salaries.test.js scripts/salary-search.test.mjs
      - name: Test source parsers with local regression fixtures
        if: steps.scope.outputs.data == 'true'
        # GIS fixtures run in health-map.yml with their own pinned dependencies.
        # Retain every other parser fixture in this lightweight salary job.
        run: |
          python3 - <<'PY'
          import sys
          import unittest
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          # Rebind immutable historical replayers to this checkout, without
          # changing their source evidence, financial rules or pinned files.
          from gap_fill_repository_paths import bind_frozen_checkout
          bind_frozen_checkout()
          tests = sorted(path.stem for path in Path('scripts').glob('test_*.py')
                         if not path.stem.startswith('test_health_')
                         and path.stem != 'test_rectify_health_maps')
          if not tests:
              raise SystemExit('No salary parser fixtures found')
          unittest.main(module=None, argv=['salary-parsers', *tests], verbosity=2)
          PY
      - name: Test new recovery sources and exact title corrections
        if: steps.scope.outputs.data == 'true'
        run: |
          python3 scripts/test-assembly-staff-recovery.py
          python3 -m unittest discover -s tests -p test_provincial_elected.py
          python3 -m unittest discover -s tests -p test_provincial_early.py
          python3 -m unittest discover -s scripts -p test_recover_vpd_salaries.py
          node --test scripts/west-vancouver-title-recovery.test.mjs
      # The frozen release gates (check_salary_historical_releases.py and
      # check_salary_current_preservation.py) are kept as records of the 2 and 6
      # November releases but no longer run: each requires the live data to equal
      # its release, so every later approved addition fails it.
      - name: Rebuild and reconcile current published salary views
        if: steps.scope.outputs.data == 'true'
        run: |
          npm run build:salaries
          npm run check:salaries
          git diff --exit-code -- public/salaries src/government/salaryIndex.js research/salaries/coverage-inventory.md research/salaries/source-inventory.md research/salaries/municipal-audit/coverage.json research/salaries/municipal-audit/coverage.md research/salaries/municipal-audit/follow-up.json research/salaries/municipal-audit/follow-up.csv research/salaries/municipal-audit/follow-up.md research/salaries/municipal-corrections
          git diff --exit-code -- research/salaries/current-preservation-2026-11-06
          git diff --exit-code -- research/salaries/sector-search-2026-10-31
          git diff --exit-code -- research/salaries/municipal-next-pass
          git diff --exit-code -- research/salaries/municipal-history-pass research/salaries/release-amendments.json
          git diff --exit-code -- research/salaries/continuation-2026-11-01
          git diff --exit-code -- research/salaries/recovery-wave-2026-11-01
          git diff --exit-code -- research/salaries/held-resolution-2026-11-01
          git diff --exit-code -- research/salaries/queue-completion-2026-11-01
          git diff --exit-code -- research/salaries/collections.json research/salaries/compiled-retention-decisions.json research/salaries/name-links
          git diff --exit-code -- research/salaries/gap-fill-2026-11-02 research/salaries/gap-fill-health-boards research/salaries/gap-fill-health-employees research/salaries/gap-fill-health-board-supplement research/salaries/gap-fill-health-other-history research/salaries/gap-fill-phsa-history research/salaries/gap-fill-municipal research/salaries/gap-fill-school-native research/salaries/gap-fill-school-north research/salaries/gap-fill-school-south
          git diff --exit-code -- research/salaries/source-follow-through-2026-11-02 research/salaries/follow-through-clbc research/salaries/follow-through-cnc research/salaries/follow-through-rru research/salaries/follow-through-langara research/salaries/follow-through-small-crowns research/salaries/follow-through-translink research/salaries/follow-through-worksafe-uvic
          test -z "$(git ls-files --others --exclude-standard -- public/salaries research/salaries)"
      - name: Build the salary interface preview
        run: npm run preview:salaries -- --build
