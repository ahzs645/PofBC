name: Verify salary name search

on:
  pull_request:
    paths:
      - 'src/salaries/**'
      - 'scripts/*salary-search*'
      - 'public/salaries/people/**'
      - 'public/salaries/links/**'
      - 'package*.json'
      - '.github/workflows/salary-search.yml'
  push:
    branches: [main]
    paths:
      - 'src/salaries/**'
      - 'scripts/*salary-search*'
      - 'public/salaries/people/**'
      - 'public/salaries/links/**'
      - 'package*.json'
      - '.github/workflows/salary-search.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  name-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test matching, filters, links and deterministic directory builds
        if: github.event_name == 'workflow_dispatch'
        run: node --test src/salaries/*.test.js scripts/salary-search.test.mjs
      - name: Verify discovery against every published salary shard
        run: npm run check:salary-search
      - name: Install isolated DOM test tools
        run: >-
          npm install --prefix "$RUNNER_TEMP/salary-ui-tools"
          --ignore-scripts --no-package-lock
          jsdom@29.1.1 esbuild@0.27.0
      - name: Verify search, cards, filters, history and retries with the locked React
        env:
          SALARY_UI_TEST_MODULES: ${{ runner.temp }}/salary-ui-tools/node_modules
        run: node scripts/verify-salary-search-ui.mjs
      - name: Build the salary interface with the locked dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm run preview:salaries -- --build
